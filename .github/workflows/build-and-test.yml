name: Build and Test

on:
  push:
    branches: [ main, develop, phase/** ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['8.0.x', '9.0.x', '10.0.x']

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ matrix.dotnet-version }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore
        continue-on-error: true

      - name: Run Tests
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal" 2>&1 | tee test-output.log
        continue-on-error: true

      - name: Capture Test Output
        if: always()
        run: |
          echo "## 📊 Test Results"
          echo ""
          if [ -f test-output.log ]; then
            echo "### Test Output"
            echo "\`\`\`"
            tail -50 test-output.log
            echo "\`\`\`"
          else
            echo "No test output found"
          fi

      - name: Check for Test Failures
        if: always()
        run: |
          mkdir -p .test-errors

          if [ -f test-output.log ] && grep -q "FAILED\|failed:" test-output.log; then
            echo "## ❌ Test Failures Found"
            grep "FAILED\|failed:" test-output.log

            echo "# Test Failures" > .test-errors/test-failures.md
            echo "" >> .test-errors/test-failures.md
            echo "**Branch:** ${{ github.ref }}" >> .test-errors/test-failures.md
            echo "**Time:** $(date)" >> .test-errors/test-failures.md
            echo "" >> .test-errors/test-failures.md
            echo "## Failed Tests" >> .test-errors/test-failures.md
            echo "" >> .test-errors/test-failures.md
            grep -A 10 "FAILED\|failed:" test-output.log >> .test-errors/test-failures.md || true
          else
            echo "✅ No test failures detected"
          fi

      - name: Upload Test Failures
        if: always() && hashFiles('.test-errors/test-failures.md') != ''
        uses: actions/upload-artifact@v4
        with:
          name: test-failures
          path: .test-errors/
          retention-days: 30

      - name: Display Failure Report
        if: always() && hashFiles('.test-errors/test-failures.md') != ''
        run: |
          echo "## 📋 Test Failure Report"
          echo ""
          cat .test-errors/test-failures.md

  logs:
    runs-on: ubuntu-latest
    if: always()
    needs: build-and-test

    steps:
      - name: Download Artifacts
        uses: dawidd6/action-download-artifact@v3
        with:
          workflow: build-and-test.yml
          if_no_artifact_found: warn

      - name: Print Summary
        run: |
          echo "## 🔍 CI/CD Execution Summary"
          echo ""
          echo "Workflow: ${{ github.workflow }}"
          echo "Branch: ${{ github.ref }}"
          echo "Event: ${{ github.event_name }}"
          echo "Status: ${{ job.status }}"
